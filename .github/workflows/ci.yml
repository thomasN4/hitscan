name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-ref group: pushes to the same PR branch supersede earlier runs.
  # Main keeps its own group; cancel-in-progress is limited to PRs so a
  # merge to main always records a result.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

# The headless smoke test (scripts/smoke-test.mjs) is deliberately not run
# here yet: it launches the developer's browser via a machine-specific path.
# Follow-up: make that path env-overridable and install Chromium on the runner.
