name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-ref group: pushes to the same PR branch supersede earlier runs.
  # Main keeps its own group; cancel-in-progress is limited to PRs so a
  # merge to main always records a result.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Reusable actions are deliberately absent. act_runner clones them with
      # its own Go client before any step can recover, and that client's TLS
      # handshakes have timed out against both GitHub and gitea.com. The source
      # repo is public and on the LAN, so plain Git is the smaller dependency.
      - name: Check out the tested revision from LAN Gitea
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git init --quiet .
          git remote add origin "$REPOSITORY_URL"
          git fetch --quiet --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --quiet --detach FETCH_HEAD

      # No `cache: npm` here. On the self-hosted Gitea runner the Actions cache
      # server is reachable only at act_runner's own docker-bridge address, which
      # the job container cannot route to; both the restore and the save then sit
      # in a connect timeout. That cost ~9 minutes of a 12.5-minute run, against
      # an `npm ci` that finishes in about 12 seconds. Re-add it only alongside a
      # runner whose cache host the job container can actually reach.
      - name: Select runner-provided Node 22
        run: bash scripts/select-runner-node.sh

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

# The headless smoke test (scripts/smoke-test.mjs) is deliberately not run
# here yet: it launches the developer's browser via a machine-specific path.
# Follow-up: make that path env-overridable and install Chromium on the runner.
