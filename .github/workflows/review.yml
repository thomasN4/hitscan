name: AI review

# An advisory PR reviewer: selects Codex by default or Claude by explicit repo
# variable override, runs the selected
# CLI headlessly against the diff, and posts the result as a Gitea comment-review.
# Deliberately a SEPARATE workflow from
# ci.yml — a flaky reviewer must never read as a failed build, and it is not on
# the critical path of a merge. ci.yml stays the gate.
#
# Gitea has no commit-comment API, so `/pulls/{index}/reviews` is the only place
# prose can sit next to a diff; that is why this hangs off pull_request_target
# rather than push. The target variant deliberately loads this workflow from the
# base branch: a PR must not be able to rewrite the job that receives review
# credentials. Posting lives in scripts/gitea-review.mjs, the reviewer's
# standing instructions in scripts/review-prompt.md — both runnable by hand,
# see their headers.
#
# One required secret, set in the repo's Settings -> Actions -> Secrets:
#   REVIEW_BOT_TOKEN         a PAT for a dedicated `review-bot` Gitea account,
#                            added as a collaborator. Not the auto-injected
#                            GITEA_TOKEN: that acts as the triggering user, and
#                            Gitea restricts reviewing a PR you authored — which
#                            here is every PR.
# Claude is an opt-in override. Set the repo Actions variable AI_REVIEWER to
# `claude`, then also set CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`.
# Leave AI_REVIEWER unset (or set it to `codex`) for the default Codex route.
#
# Codex uses personal ChatGPT subscription auth from a private, persistent
# runner bind mount at /codex-home. Set CODEX_HOME to that mount, run
# `CODEX_HOME=/codex-home codex login` once in the runner environment, and keep
# it owner-restricted: Codex refreshes its OAuth state there between jobs. Only
# the Codex job runs on that credential-mounted runner. Routing, Claude and
# posting run on the ordinary runner, so repository-owned scripts never execute
# in the container that can read the Codex credential.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  # pull_request_target's ref is the base branch, so key by PR number or one PR
  # would cancel another PR's in-flight review.
  group: review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select AI reviewer
    # `tea pr create --draft` prepends `WIP: ` and stripping it is what marks a
    # PR ready (AGENTS.md step 4), so this gate is what keeps the reviewer from
    # firing on every push of work still in progress. `edited` is in the trigger
    # list precisely so that stripping the prefix is itself an event.
    #
    # The head-repo check keeps every review credential away from a fork's PR.
    if: >-
      !startsWith(github.event.pull_request.title, 'WIP:')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reviewed: ${{ steps.dedupe.outputs.reviewed }}
      reviewer: ${{ steps.route.outputs.reviewer }}
    # GITEA_TOKEN is deliberately NOT here. It carries repo write, and job-level
    # env would hand it to the Review step, where a model is reading text this
    # repo does not control (diff contents, PR title). Only the two API steps get
    # the dedicated bot PAT.
    env:
      GITEA_API: ${{ github.server_url }}
      GITEA_REPO: ${{ github.repository }}
      PR_INDEX: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Gitea otherwise resolves relative action names through GitHub. Use the
      # official Gitea mirrors after repeated GitHub TLS fetch timeouts.
      - uses: https://gitea.com/actions/checkout@v7
        with:
          # Control-plane scripts must come from the trusted target revision,
          # never from the PR head that they inspect.
          ref: ${{ github.event.pull_request.base.sha }}

      # No `cache: npm` here, for the same reason as ci.yml: the Actions cache
      # server resolves to act_runner's own docker-bridge address, which the job
      # container cannot route to, so both restore and save sit in a connect
      # timeout.
      - uses: https://gitea.com/actions/setup-node@v7
        with:
          node-version: 22

      # Deliberately no `npm ci`. This job reads code, it does not run the suite
      # (ci.yml owns that on the same commit), and gitea-review.mjs is written
      # against Node built-ins and global fetch so it needs no install.

      # `edited` also fires when the PR *description* changes, so without this
      # a typo fix in the body would post a second review of identical code.
      - name: Check whether this commit was already reviewed
        id: dedupe
        # Assign first, echo second. `echo "reviewed=$(...)"` would take its exit
        # status from echo, so an API failure would read as "not yet reviewed"
        # and post a duplicate; an assignment inherits the substitution's status,
        # which `bash -e` then turns into a red step.
        env:
          GITEA_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
        run: |
          reviewed="$(node scripts/gitea-review.mjs already-reviewed)"
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"

      # AI_REVIEWER is intentionally optional: unset selects Codex, while
      # `claude` is a manual override. Invalid values fail rather than silently
      # selecting an unintended subscription. Issue #59 tracks restoring the
      # original automatic quota-aware selection once supported headless auth
      # can read Claude subscription usage.
      - name: Select reviewer
        id: route
        if: steps.dedupe.outputs.reviewed != 'true'
        env:
          AI_REVIEWER: ${{ vars.AI_REVIEWER }}
        run: |
          reviewer="$(node scripts/review-route.mjs)"
          echo "reviewer=$reviewer" >> "$GITHUB_OUTPUT"

  codex_review:
    name: GPT-5.6 Sol PR review
    needs: prepare
    if: >-
      needs.prepare.outputs.reviewed != 'true'
      && needs.prepare.outputs.reviewer == 'codex'
    runs-on: ai-review
    timeout-minutes: 25
    outputs:
      review_b64: ${{ steps.result.outputs.review_b64 }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CODEX_HOME: /codex-home
      # Permission profiles, unlike the older `--sandbox` modes, can carve a
      # secret path out of a broader read-only policy. Keep this one inline so
      # the preflight and real review cannot silently select different policies.
      CODEX_REVIEW_PROFILE: 'permissions.review={extends=":read-only", filesystem={"/codex-home"="deny"}}'
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          # pull_request_target checks out the base by default; the model needs
          # the untrusted head tree as data, while the workflow and standing
          # prompt remain pinned to the trusted base revision.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Do not leave the job token in .git/config for the model to read.
          persist-credentials: false

      - uses: https://gitea.com/actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Codex
        run: |
          # Codex's Linux sandbox prefers the distribution bwrap binary. The
          # runner host carries its Ubuntu AppArmor profile; the job container
          # still needs the binary whose path activates that profile.
          apt-get update
          apt-get install --no-install-recommends --yes bubblewrap
          # Do not let a PR-owned .npmrc select what runs beside the credential.
          (cd /tmp && npm i -g --ignore-scripts @openai/codex@0.149.1)
          codex login status
          if ! test -r "$CODEX_HOME/auth.json"; then
            echo "::error::Expected file-backed Codex credentials at $CODEX_HOME/auth.json"
            exit 1
          fi

          # Fail before invoking the model if the nested job container cannot
          # create the exact permission profile used by the review. An empty
          # temporary CODEX_HOME gives the probe the same absence of user config
          # as `codex exec --ignore-user-config`; its parent needs no auth.
          probe_codex_home="$(mktemp -d)"
          CODEX_HOME="$probe_codex_home" codex \
            --config 'default_permissions="review"' \
            --config "$CODEX_REVIEW_PROFILE" \
            sandbox \
            --permission-profile review \
            -- \
            sh -c 'test -r package.json && test ! -w package.json && test ! -r /codex-home/auth.json'

      - name: Review with GPT-5.6 Sol
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Codex's custom permission profile is the mutation and credential-read
        # boundary. `--ignore-user-config` keeps runner-local preferences and
        # integrations out of this reproducible job while the parent CLI still
        # reads auth from CODEX_HOME; `--ephemeral` leaves no run history behind.
        # The standing prompt remains repo-owned and reviewable.
        run: |
          git show "$BASE_SHA:scripts/review-prompt.md" > /tmp/review-prompt.md
          BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          REVIEW_PROMPT="Review the pull request titled \"$PR_TITLE\", whose base commit is $BASE_SHA and head commit is $HEAD_SHA.

          $(cat /tmp/review-prompt.md)"
          (sleep 600; echo "::warning::GPT-5.6 Sol review is still running after 10 minutes; allowing it to continue to the workflow's hard limit.") &
          warning_pid=$!
          trap 'kill "$warning_pid" 2>/dev/null || true' EXIT
          codex exec \
            --model gpt-5.6-sol \
            --config 'model_reasoning_effort="high"' \
            --config 'default_permissions="review"' \
            --config "$CODEX_REVIEW_PROFILE" \
            --strict-config \
            --ephemeral \
            --ignore-user-config \
            --ignore-rules \
            --output-last-message review.md \
            "$REVIEW_PROMPT"
          kill "$warning_pid" 2>/dev/null || true
          wait "$warning_pid" 2>/dev/null || true
          trap - EXIT

      - name: Export review
        id: result
        run: |
          if ! test -s review.md; then
            echo "::error::Review file is empty"
            exit 1
          fi
          echo "review_b64=$(base64 -w0 review.md)" >> "$GITHUB_OUTPUT"

  claude_review:
    name: Claude PR review
    needs: prepare
    if: >-
      needs.prepare.outputs.reviewed != 'true'
      && needs.prepare.outputs.reviewer == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      review_b64: ${{ steps.result.outputs.review_b64 }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: https://gitea.com/actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: (cd /tmp && npm i -g --ignore-scripts @anthropic-ai/claude-code@2.1.246)

      - name: Review with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Write and Edit are absent from the allowlist, which is what makes the
        # reviewer read-only by construction rather than by asking politely: in
        # `-p` mode a tool outside the list is denied without a prompt.
        run: |
          git show "$BASE_SHA:scripts/review-prompt.md" > /tmp/review-prompt.md
          BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          (sleep 600; echo "::warning::Claude review is still running after 10 minutes; allowing it to continue to the workflow's hard limit.") &
          warning_pid=$!
          trap 'kill "$warning_pid" 2>/dev/null || true' EXIT
          claude -p "Review the pull request titled \"$PR_TITLE\", whose base commit is $BASE_SHA and head commit is $HEAD_SHA." \
            --model claude-opus-5 \
            --append-system-prompt "$(cat /tmp/review-prompt.md)" \
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)" \
            > review.md
          kill "$warning_pid" 2>/dev/null || true
          wait "$warning_pid" 2>/dev/null || true
          trap - EXIT

      - name: Export review
        id: result
        run: |
          if ! test -s review.md; then
            echo "::error::Review file is empty"
            exit 1
          fi
          echo "review_b64=$(base64 -w0 review.md)" >> "$GITHUB_OUTPUT"

  post:
    name: Post AI review
    needs: [prepare, codex_review, claude_review]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.reviewed != 'true'
      && (
        (needs.prepare.outputs.reviewer == 'codex' && needs.codex_review.result == 'success')
        || (needs.prepare.outputs.reviewer == 'claude' && needs.claude_review.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITEA_API: ${{ github.server_url }}
      GITEA_REPO: ${{ github.repository }}
      PR_INDEX: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEWER: ${{ needs.prepare.outputs.reviewer }}
    steps:
      - uses: https://gitea.com/actions/checkout@v7
        with:
          # The poster runs with a PAT, so execute the base branch's audited
          # implementation rather than a PR-controlled replacement.
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: https://gitea.com/actions/setup-node@v7
        with:
          node-version: 22

      - name: Decode Codex review
        if: needs.prepare.outputs.reviewer == 'codex'
        env:
          REVIEW_B64: ${{ needs.codex_review.outputs.review_b64 }}
        run: |
          set -o pipefail
          printf '%s' "$REVIEW_B64" | base64 --decode > review.md

      - name: Decode Claude review
        if: needs.prepare.outputs.reviewer == 'claude'
        env:
          REVIEW_B64: ${{ needs.claude_review.outputs.review_b64 }}
        run: |
          set -o pipefail
          printf '%s' "$REVIEW_B64" | base64 --decode > review.md

      # Not `continue-on-error`: a reviewer that quietly stops posting is worse
      # than a red job, and this workflow gates nothing, so red is cheap here.
      - name: Post the review
        env:
          GITEA_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
        run: node scripts/gitea-review.mjs post review.md "$REVIEWER"
