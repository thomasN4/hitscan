<?xml version="1.0" encoding="UTF-8"?>
<!-- Elevation playtest map — top-down reference, north up.
     Sources: src/maps/elevation.ts (geometry), src/core/state.ts BOT_SPAWNS +
     DOM_FLAGS (zones, flags), src/combat.ts respawn (same zone draw as bots).
     Units are meters. Origin at map centre. +x east, +z south, north = -z (up).
     Deck walk surface 3.6 m, plateau top 3.0 m. Stair arrows point UPHILL. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1140" font-family="system-ui, -apple-system, sans-serif">
  <title>Elevation — top-down map</title>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Elevation — top-down (north up)</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#555">meters · origin at map centre · +x east · +z south · north = -z (up) · deck 3.6 m · plateau 3.0 m</text>

  <!-- North arrow (screen space, top right) -->
  <g transform="translate(922 150)">
    <polygon points="0,-30 11,8 0,1 -11,8" fill="#222"/>
    <text y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#222">N</text>
    <text y="43" text-anchor="middle" font-size="10" fill="#555">-z</text>
  </g>

  <!-- ================= WORLD (1 unit = 1 m) ================= -->
  <g id="world" transform="translate(480 490) scale(6.3)">

    <!-- ground -->
    <rect x="-60" y="-60" width="120" height="120" fill="#d9c69c" stroke="#8a7a55" stroke-width="0.3"/>

    <!-- minor grid, 5 m -->
    <g stroke="#3a2f1a" stroke-width="0.07" opacity="0.10">
      <path d="M-55 -60V60 M-45 -60V60 M-35 -60V60 M-25 -60V60 M-15 -60V60 M-5 -60V60 M5 -60V60 M15 -60V60 M25 -60V60 M35 -60V60 M45 -60V60 M55 -60V60 M-60 -55H60 M-60 -45H60 M-60 -35H60 M-60 -25H60 M-60 -15H60 M-60 -5H60 M-60 5H60 M-60 15H60 M-60 25H60 M-60 35H60 M-60 45H60 M-60 55H60"/>
    </g>
    <!-- major grid, 10 m -->
    <g stroke="#3a2f1a" stroke-width="0.14" opacity="0.22">
      <path d="M-60 -60V60 M-50 -60V60 M-40 -60V60 M-30 -60V60 M-20 -60V60 M-10 -60V60 M0 -60V60 M10 -60V60 M20 -60V60 M30 -60V60 M40 -60V60 M50 -60V60 M60 -60V60 M-60 -60H60 M-60 -50H60 M-60 -40H60 M-60 -30H60 M-60 -20H60 M-60 -10H60 M-60 0H60 M-60 10H60 M-60 20H60 M-60 30H60 M-60 40H60 M-60 50H60 M-60 60H60"/>
    </g>
    <!-- centre axes -->
    <g stroke="#3a2f1a" stroke-width="0.14" opacity="0.35" stroke-dasharray="2 1.4">
      <path d="M0 -60V60 M-60 0H60"/>
    </g>

    <!-- spawn pockets -->
    <rect x="10" y="-55" width="40" height="25" fill="#c0392b" fill-opacity="0.10" stroke="#922b21" stroke-width="0.3" stroke-dasharray="2 1"/>
    <rect x="-50" y="35" width="55" height="20" fill="#2471a3" fill-opacity="0.10" stroke="#1a5276" stroke-width="0.3" stroke-dasharray="2 1"/>

    <!-- C. west plateau (solid, top 3.0) + east stair -->
    <rect x="-49" y="-41" width="22" height="22" fill="#b7956b" stroke="#5d4a26" stroke-width="0.25"/>
    <rect x="-27" y="-33" width="7.5" height="6" fill="#e8dcbf" stroke="#7d5a29" stroke-width="0.2"/>
    <path d="M-26.25 -33V-27 M-25.5 -33V-27 M-24.75 -33V-27 M-24 -33V-27 M-23.25 -33V-27 M-22.5 -33V-27 M-21.75 -33V-27 M-21 -33V-27 M-20.25 -33V-27" stroke="#7d5a29" stroke-width="0.12"/>
    <line x1="-20.5" y1="-30" x2="-26" y2="-30" stroke="#7d3c00" stroke-width="0.35"/>
    <polygon points="-27.6,-30 -25.9,-30.8 -25.9,-29.2" fill="#7d3c00"/>

    <!-- B. tower block (solid 0..3.6) + south stair + bridge deck -->
    <rect x="30" y="-6" width="10" height="12" fill="#a8895a" stroke="#5d4a26" stroke-width="0.25"/>
    <rect x="33" y="6.5" width="4" height="9" fill="#e8dcbf" stroke="#7d5a29" stroke-width="0.2"/>
    <path d="M33 7.25H37 M33 8H37 M33 8.75H37 M33 9.5H37 M33 10.25H37 M33 11H37 M33 11.75H37 M33 12.5H37 M33 13.25H37 M33 14H37 M33 14.75H37" stroke="#7d5a29" stroke-width="0.12"/>
    <line x1="35" y1="14.5" x2="35" y2="7.5" stroke="#7d3c00" stroke-width="0.35"/>
    <polygon points="35,6.1 34.2,7.8 35.8,7.8" fill="#7d3c00"/>
    <rect x="14" y="-2" width="16" height="4" fill="#989086" fill-opacity="0.9" stroke="#555" stroke-width="0.2" stroke-dasharray="1.2 0.7"/>

    <!-- A. ground-floor walls (deck drawn translucent over them) -->
    <g fill="#6e5a36">
      <rect x="-14" y="-12.5" width="12" height="1"/>
      <rect x="2" y="-12.5" width="12" height="1"/>
      <rect x="-14" y="11.5" width="12" height="1"/>
      <rect x="2" y="11.5" width="12" height="1"/>
      <rect x="-14.5" y="-12" width="1" height="10"/>
      <rect x="-14.5" y="2" width="1" height="10"/>
      <rect x="13.5" y="-12" width="1" height="24"/>
    </g>

    <!-- A. second-floor slab (translucent so ground walls show through) -->
    <g fill="#989086" fill-opacity="0.55" stroke="#4a4a4a" stroke-width="0.2" stroke-dasharray="1.2 0.7">
      <rect x="-14" y="-12" width="16" height="24"/>
      <rect x="6" y="-12" width="8" height="24"/>
      <rect x="2" y="0" width="4" height="12"/>
      <rect x="2" y="-12" width="4" height="3"/>
    </g>
    <!-- stairwell hole x[2,6] z[-9,0] -->
    <rect x="2" y="-9" width="4" height="9" fill="none" stroke="#c0392b" stroke-width="0.25" stroke-dasharray="1 0.6"/>

    <!-- A. internal stair (footprint = hole) -->
    <rect x="2" y="-9" width="4" height="9" fill="#e8dcbf" fill-opacity="0.85" stroke="#7d5a29" stroke-width="0.2"/>
    <path d="M2 -8.25H6 M2 -7.5H6 M2 -6.75H6 M2 -6H6 M2 -5.25H6 M2 -4.5H6 M2 -3.75H6 M2 -3H6 M2 -2.25H6 M2 -1.5H6 M2 -0.75H6" stroke="#7d5a29" stroke-width="0.12"/>
    <line x1="4" y1="-8" x2="4" y2="-1" stroke="#7d3c00" stroke-width="0.35"/>
    <polygon points="4,-0.1 3.3,-1.7 4.7,-1.7" fill="#7d3c00"/>

    <!-- A. external stair up the south face -->
    <rect x="6" y="12.5" width="4" height="9" fill="#e8dcbf" stroke="#7d5a29" stroke-width="0.2"/>
    <path d="M6 13.25H10 M6 14H10 M6 14.75H10 M6 15.5H10 M6 16.25H10 M6 17H10 M6 17.75H10 M6 18.5H10 M6 19.25H10 M6 20H10 M6 20.75H10" stroke="#7d5a29" stroke-width="0.12"/>
    <line x1="8" y1="20.5" x2="8" y2="13.5" stroke="#7d3c00" stroke-width="0.35"/>
    <polygon points="8,12.6 7.3,14.2 8.7,14.2" fill="#7d3c00"/>

    <!-- A. parapets (deck level) -->
    <g fill="#4f4227">
      <rect x="-14" y="11.75" width="20" height="0.5"/>
      <rect x="10" y="11.75" width="4" height="0.5"/>
      <rect x="-14" y="-12.25" width="12" height="0.5"/>
      <rect x="2" y="-12.25" width="12" height="0.5"/>
      <rect x="-14.25" y="-12" width="0.5" height="10"/>
      <rect x="-14.25" y="2" width="0.5" height="10"/>
      <rect x="13.75" y="-12" width="0.5" height="10"/>
      <rect x="13.75" y="2" width="0.5" height="10"/>
    </g>

    <!-- D. jump-only crates (1.2 -> 2.4 -> bridge) -->
    <rect x="16" y="6" width="4" height="4" fill="#8a6d3f" stroke="#4a3517" stroke-width="0.2"/>
    <rect x="16" y="2" width="4" height="4" fill="#8a6d3f" stroke="#4a3517" stroke-width="0.2"/>

    <!-- E. cover crates (3x3, ground) -->
    <g fill="#8a6d3f" stroke="#4a3517" stroke-width="0.2">
      <rect x="-23.5" y="-15.5" width="3" height="3"/>
      <rect x="-26.5" y="-12.5" width="3" height="3"/>
      <rect x="-25" y="-14" width="3" height="3"/>
      <rect x="22.5" y="-19.5" width="3" height="3"/>
      <rect x="25.5" y="-22.5" width="3" height="3"/>
      <rect x="-31.5" y="14.5" width="3" height="3"/>
      <rect x="-34.5" y="17.5" width="3" height="3"/>
      <rect x="-33" y="16" width="3" height="3"/>
      <rect x="38.5" y="24.5" width="3" height="3"/>
      <rect x="41.5" y="21.5" width="3" height="3"/>
      <rect x="-7.5" y="28.5" width="3" height="3"/>
      <rect x="-4.5" y="31.5" width="3" height="3"/>
      <rect x="44.5" y="-15.5" width="3" height="3"/>
      <rect x="-47.5" y="2.5" width="3" height="3"/>
    </g>
    <!-- stacked second tier (jump-up only) -->
    <g fill="none" stroke="#fff" stroke-width="0.25" stroke-dasharray="0.8 0.5">
      <rect x="-25" y="-14" width="3" height="3"/>
      <rect x="-33" y="16" width="3" height="3"/>
    </g>

    <!-- perimeter walls -->
    <g fill="#8d8577" stroke="#5d564a" stroke-width="0.2">
      <rect x="-62" y="59" width="124" height="2"/>
      <rect x="-62" y="-61" width="124" height="2"/>
      <rect x="59" y="-60" width="2" height="120"/>
      <rect x="-61" y="-60" width="2" height="120"/>
    </g>

    <!-- domination flags (r = 4.5 m) -->
    <circle cx="-38" cy="-30" r="4.5" fill="#ffffff" fill-opacity="0.92" stroke="#935116" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" fill-opacity="0.92" stroke="#6c3483" stroke-width="0.4"/>
    <circle cx="35" cy="38" r="4.5" fill="#ffffff" fill-opacity="0.92" stroke="#1a5276" stroke-width="0.4"/>

    <!-- player spawns: same draw as their team's bots, no fixed point (range excepted) -->
    <!-- ===== labels (world-anchored, px-sized via inverse scale) ===== -->
    <g transform="translate(30 -52.5) scale(0.15873)">
      <text text-anchor="middle" font-size="12" font-weight="700" fill="#7b241c" paint-order="stroke" stroke="#d9c69c" stroke-width="3">T pocket · x 10…50, z -55…-30</text>
      <text text-anchor="middle" font-size="11" y="15" fill="#7b241c" paint-order="stroke" stroke="#d9c69c" stroke-width="3">you spawn with your bots</text>
    </g>
    <g transform="translate(-22.5 45) scale(0.15873)">
      <text text-anchor="middle" font-size="12" font-weight="700" fill="#1a5276" paint-order="stroke" stroke="#d9c69c" stroke-width="3">CT pocket · x -50…5, z 35…55</text>
      <text text-anchor="middle" font-size="11" y="15" fill="#1a5276" paint-order="stroke" stroke="#d9c69c" stroke-width="3">you spawn with your bots</text>
    </g>
    <g transform="translate(-38 -30) scale(0.15873)">
      <text text-anchor="middle" font-size="26" font-weight="800" dy="7" fill="#935116">A</text>
      <text text-anchor="middle" font-size="10" dy="24" fill="#935116">y 3.0</text>
    </g>
    <g transform="translate(0 0) scale(0.15873)">
      <text text-anchor="middle" font-size="26" font-weight="800" dy="7" fill="#6c3483">B</text>
      <text text-anchor="middle" font-size="10" dy="24" fill="#6c3483">y 3.6</text>
    </g>
    <g transform="translate(35 38) scale(0.15873)">
      <text text-anchor="middle" font-size="26" font-weight="800" dy="7" fill="#1a5276">C</text>
      <text text-anchor="middle" font-size="10" dy="24" fill="#1a5276">y 0</text>
    </g>
    <g transform="translate(-38 -37.5) scale(0.15873)">
      <text text-anchor="middle" font-size="12" font-weight="700" fill="#4a3517" paint-order="stroke" stroke="#d9c69c" stroke-width="3">plateau 3.0</text>
    </g>
    <g transform="translate(35 0) scale(0.15873)">
      <text text-anchor="middle" font-size="12" font-weight="700" fill="#3e2f14" paint-order="stroke" stroke="#a8895a" stroke-width="3">tower 3.6</text>
    </g>
    <g transform="translate(22 -4.6) scale(0.15873)">
      <text text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#d9c69c" stroke-width="3">bridge 3.6, unrailed</text>
    </g>
    <g transform="translate(-4 16.5) scale(0.15873)">
      <text text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#d9c69c" stroke-width="3">two-story building · deck 3.6</text>
    </g>
    <g transform="translate(27.5 8) scale(0.15873)">
      <text font-size="11" fill="#4a3517" paint-order="stroke" stroke="#d9c69c" stroke-width="3">jump 1.2 → 2.4 → bridge</text>
    </g>
    <g transform="translate(0 -14.6) scale(0.15873)">
      <text text-anchor="middle" font-size="10" fill="#1e8449">4 m door</text>
    </g>
    <g transform="translate(0 14.6) scale(0.15873)">
      <text text-anchor="middle" font-size="10" fill="#1e8449">4 m door</text>
    </g>
    <g transform="translate(-17.5 0) scale(0.15873)">
      <text text-anchor="middle" font-size="10" fill="#1e8449">door</text>
    </g>
    <g transform="translate(0 -10.2) scale(0.15873)">
      <text text-anchor="middle" font-size="10" fill="#922b21">open edge · 3.6 m drop</text>
    </g>

    <!-- grid coordinate labels -->
    <g font-size="10" fill="#6b5f45">
      <g transform="translate(-60 -63) scale(0.15873)"><text text-anchor="middle" font-size="10">-60</text></g>
      <g transform="translate(-40 -63) scale(0.15873)"><text text-anchor="middle" font-size="10">-40</text></g>
      <g transform="translate(-20 -63) scale(0.15873)"><text text-anchor="middle" font-size="10">-20</text></g>
      <g transform="translate(0 -63) scale(0.15873)"><text text-anchor="middle" font-size="10">x 0</text></g>
      <g transform="translate(20 -63) scale(0.15873)"><text text-anchor="middle" font-size="10">20</text></g>
      <g transform="translate(40 -63) scale(0.15873)"><text text-anchor="middle" font-size="10">40</text></g>
      <g transform="translate(60 -63) scale(0.15873)"><text text-anchor="middle" font-size="10">60</text></g>
      <g transform="translate(-63.5 -60) scale(0.15873)"><text text-anchor="end" font-size="10">-60</text></g>
      <g transform="translate(-63.5 -40) scale(0.15873)"><text text-anchor="end" font-size="10">-40</text></g>
      <g transform="translate(-63.5 -20) scale(0.15873)"><text text-anchor="end" font-size="10">-20</text></g>
      <g transform="translate(-63.5 0) scale(0.15873)"><text text-anchor="end" font-size="10">z 0</text></g>
      <g transform="translate(-63.5 20) scale(0.15873)"><text text-anchor="end" font-size="10">20</text></g>
      <g transform="translate(-63.5 40) scale(0.15873)"><text text-anchor="end" font-size="10">40</text></g>
      <g transform="translate(-63.5 60) scale(0.15873)"><text text-anchor="end" font-size="10">60</text></g>
    </g>

    <!-- scale bar: 10 m -->
    <rect x="-60" y="64.5" width="10" height="0.6" fill="#222"/>
    <g transform="translate(-55 67.5) scale(0.15873)">
      <text text-anchor="middle" font-size="11" fill="#222">10 m</text>
    </g>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-size="13" fill="#222">
    <text x="70" y="935" font-size="15" font-weight="700">Legend</text>

    <rect x="70" y="948" width="18" height="14" fill="#c0392b" fill-opacity="0.18" stroke="#922b21" stroke-dasharray="3 2"/>
    <text x="96" y="960">T spawn pocket (northeast)</text>

    <rect x="70" y="970" width="18" height="14" fill="#2471a3" fill-opacity="0.18" stroke="#1a5276" stroke-dasharray="3 2"/>
    <text x="96" y="982">CT spawn pocket (southwest)</text>

    <text x="70" y="1011">you draw from the same pocket as your bots (range: firing line)</text>

    <circle cx="79" cy="1027" r="9" fill="#fff" stroke="#6c3483" stroke-width="2"/>
    <text x="73" y="1031" font-size="11" font-weight="800" fill="#6c3483">B</text>
    <text x="96" y="1031">dom flag, r 4.5 m (A y3.0 · B y3.6 · C y0)</text>

    <rect x="500" y="948" width="18" height="14" fill="#989086" fill-opacity="0.55" stroke="#4a4a4a" stroke-dasharray="3 2"/>
    <text x="526" y="960">deck slab 3.6 (translucent: walls show through)</text>

    <rect x="500" y="970" width="18" height="14" fill="#b7956b" stroke="#5d4a26"/>
    <text x="526" y="982">plateau 3.0 / tower 3.6 (solid)</text>

    <rect x="500" y="992" width="18" height="14" fill="#e8dcbf" stroke="#7d5a29"/>
    <polygon points="540,999 546,1003 540,1007" fill="#7d3c00"/>
    <text x="552" y="1007">stairs (arrow = uphill) + treads every 0.75 m</text>

    <rect x="500" y="1014" width="18" height="14" fill="#8a6d3f" stroke="#4a3517"/>
    <text x="526" y="1026">crate 3×3 (white dashed = stacked 2nd tier)</text>

    <text x="70" y="1062" font-size="12" fill="#555">Red dashed hole x[2,6] z[-9,0] = stairwell in slab · south stair lands through parapet gap x[6,10] · bridge mouth z[-2,2]</text>
    <text x="70" y="1082" font-size="12" fill="#555">Source: src/maps/elevation.ts · BOT_SPAWNS / DOM_FLAGS in src/core/state.ts · respawn in src/combat.ts</text>
  </g>
</svg>
